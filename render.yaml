services:
  - type: web
    name: garanti-group-ai
    runtime: node
    plan: free
    buildCommand: npm install --ignore-scripts --no-audit --no-fund
    startCommand: node server.mjs
    healthCheckPath: /api/catalog
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGIN
        value: https://teslamap.github.io
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
