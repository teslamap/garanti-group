name: Deploy Garanti Group to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install isolated Firebase test tools
        run: npm install --no-save --package-lock=false firebase@12.19.0 @firebase/rules-unit-testing@5.0.0 firebase-tools
      - name: Validate Firestore and Storage permissions in emulators
        run: npx firebase emulators:exec --project demo-garanti-group --only firestore,storage "node --test tests/firebase-rules.integration.mjs"
  deploy:
    needs: firebase-rules
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test backend and pricing
        run: node --test
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html admin.html upgrade.css upgrade.js site-config.js firebase-client.js firebase-validation.js project-upload.js chat-widget.js chat-widget.css ai-admin.js _site/
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

